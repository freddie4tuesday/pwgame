<style>
:root{--bg:#ecefeb;--ink:#1d2421;--ink2:#5a645f;--line:#cfd5cf;--btn:#ffffff}

.bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .3s}

<script type="application/json" id="deck">{"app":"john-ferenz-flashcard-maker","schemaVersion":1,"appVersion":"1.3.0","savedAt":"2026-10-02T15:50:39.128Z","deck":{"title":"Generic CT Poll Worker Training Cards","colors":{"background":"#0D24CE","text":"#FFFFFF"},"logo":null,"closingMessage":"The Registrars of Voters are thankful for the dedication of all who assist voters at every election.\n\n","cards":[{"question":"Who is the most important person at the election?","answer":"The voter. Everything is based on providing the registered voter with the best possible experience."},{"question":"What are the official hours of voting on election day?","answer":"On election day all polling places are open from 6AM to 8PM."},{"question":"Who must be sworn in by the Moderator before starting work?","answer":"All election officials must be sworn in prior to the start of the election."},{"question":"Can a poll worker wear a t-shirt or pin supporting a candidate?","answer":"No. Poll workers must remain non-partisan and cannot wear or display any political materials."},{"question":"What does the \"75-foot sign\" signify?","answer":"The boundary within which no campaigning or political discussion is allowed. It is measured in an arc from the exterior polling place doors."},{"question":"Who is allowed inside the polling place?","answer":"Voters who are voting, members of the press, election officials, credentialed representatives from the Secretary of the State and individuals assisting a voter."},{"question":"What is the IVS system?","answer":"The Inspire Voting System is the accessible ballot marking device available for any voter who wishes to use it."},{"question":"Can a child enter the voting booth with a parent?","answer":"Yes, a child may accompany a parent into the voting booth. The parent, however, must insert their own ballot in the tabulator."},{"question":"What is Same Day Registration (SDR)?","answer":"The process that allows an unregistered voter to register and vote at a designated SDR location (Town Hall). Voters who are not registered MUST come to Town Hall to take advantage of this."},{"question":"What must be displayed on a wall for all voters to see?","answer":"A sample ballot and six large informational posters, including the \"Voters Bill of Rights.\""},{"question":"What is the purpose of the Moderator's Diary?","answer":"To record any unusual occurrences, from machine jams to disruptive voters, to help improve future elections."},{"question":"If a voter needs assistance due to a disability or language barrier, what is the procedure?","answer":"Notify the Moderator. Two election officials of differing parties will assist the voter."},{"question":"What are the acceptable forms of ID a voter can present?","answer":"A pre-printed ID with their name and address; name and signature; OR name and photograph."},{"question":"A voter is on the Active list but has no ID. What is the procedure?","answer":"The voter must sign the Form \"Signatory Affidavit for Voters Who Do Not Present ID.\""},{"question":"A voter is on the Inactive List. What must they do to be restored and vote?","answer":"They must show a current and valid ID, and complete a new voter registration card."},{"question":"What does the letter \"A\" in red or blue next to a voter's name signify?","answer":"The voter has already cast an Absentee Ballot. This voter cannot vote in person."},{"question":"At the polls, a voter needs to change their address within Greenwich. What do you do?","answer":"Direct them to the Assistant Registrar or the Moderator, who will have them complete a new voter registration card."},{"question":"What do you write next to the name of a voter who casts a Provisional Ballot?","answer":"\"PB\" Do NOT cross out the name."},{"question":"What do you write next to the name of a voter who casts a Challenge Ballot?","answer":"\"CB\" Do NOT cross out the name."},{"question":"A voter presents a State of CT Confidentiality Card. Where is their name found?","answer":"On the last page of the Official Checker book. You must not ask for their address."},{"question":"What is the purpose of the tally sheet at the checker's table?","answer":"To make a hash mark for every voter processed, which is used for the hourly count reconciliation."},{"question":"What is the Supplemental List?","answer":"A list of voters who have registered or made changes to their registration close to Election Day, after the main registry list was printed."},{"question":"If a voter provides a driver's license with an old address, is it valid?","answer":"Yes, ID does not need to have the voter's current address. At the polling place ID is used to verify identity, not residency."},{"question":"A voter has moved from another town in CT and is not on your list. What should you do?","answer":"Direct them to Town Hall for Same Day Registration (SDR)."},{"question":"Who is responsible for placing the blue \"A\"s next to the names of absentee voters?","answer":"The Moderator will periodically instruct the Official Checker to do this based on updates from the Registrars of Voters."},{"question":"What must a Ballot Clerk give to every voter along with their ballot?","answer":"A privacy sleeve. Please check to make sure sleeve is empty."},{"question":"What is a \"spoiled\" ballot?","answer":"A ballot that a voter makes a mistake on and returns to the Ballot Clerk to be replaced with a fresh ballot."},{"question":"How many replacement ballots can a single voter receive?","answer":"A voter can receive as many replacements as they need."},{"question":"What must the Ballot Clerk do with a spoiled ballot?","answer":"Place it in the \"Spoiled Ballot Envelope\" and record it on the appropriate tally sheet."},{"question":"How does the ballot clerk keep track of the number of ballots issued?","answer":"By using a tally sheet, making a hash mark for every ballot given to a voter."},{"question":"What should the Ballot Clerk do with the tally sheet at the end of the night?","answer":"Total the number of ballots issued and give the sheet to the Moderator as part of the closing reconciliation."},{"question":"A ballot jams, but the screen shows a GREEN checkmark. Has the ballot been counted?","answer":"Yes. The vote was successfully counted. Call the Moderator to clear the jam."},{"question":"A ballot jams, but the screen shows a RED X. Has the ballot been counted?","answer":"No. The vote was NOT counted. Call the Moderator immediately."},{"question":"How far away should the tabulator tender stand from the tabulator?","answer":"At least 4 feet away to protect voter privacy."},{"question":"What should the tabulator tender do with used privacy sleeves?","answer":"Periodically collect them and return them to the ballot clerk's table. Make certain they are EMPTY."},{"question":"What is the most important rule for a tabulator tender regarding a voter's ballot?","answer":"Never look at it. The voter's right to a secret ballot is paramount."},{"question":"If the tabulator screen displays a message you don't understand, what should you do?","answer":"Call the Moderator immediately."},{"question":"When can you leave your station unattended?","answer":"Never. Your may leave your station only when you have been relieved for a break by another election official."},{"question":"What is the Moderator's ultimate responsibility at the polling place?","answer":"To ensure the election is conducted fairly, efficiently, and in accordance with all state laws and procedures."},{"question":"What must be verified before cutting the seals on the Big Blue Bin?","answer":"The seal numbers must match the numbers on the Certificate for Opening of the Polls in the Moderator Return."},{"question":"How many copies of the results tape are printed at the end of the night, and where do they go?","answer":"Three copies. One is returned to the ROVs, one is posted on the wall for the public, and one is placed inside the used ballot bag."},{"question":"How many copies of the zero tape are printed in the morning, and where do they go?","answer":"Three copies. One is returned to the ROVs, one is posted on the wall for the public, and one is placed inside the used ballot bag."},{"question":"What is the process for a hand count of ballots from the auxiliary bin?","answer":"The count must be done by two officials of different parties, and the results recorded on the Hand Count Tally Sheet."},{"question":"If the tabulator malfunctions, who must be called immediately?","answer":"The Registrar of Voters' office. We will send out an additional tabulator to replace malfunctioning equipment."},{"question":"What is the role of the Special Assistant Registrar (SAR)?","answer":"The SAR is to assist the Moderator with the setup of the tabulators and the IVS system. At night they will assist with packing up the equipment."},{"question":"Who is ultimately in charge of the polling place and has the final say on all procedural decisions?","answer":"The Moderator."},{"question":"How many days of early voting are there for a November election?","answer":"There are 14 consecutive days ending on the Sunday before Election Day."},{"question":"How many days of early voting are there for a party primary?","answer":"There are 7 consecutive days ending on the Sunday before the Primary."},{"question":"What are the rules for press who want to enter a polling place?","answer":"The Moderator may grant permission, but they are not allowed to record a voter's marked ballot or disrupt the voting process."},{"question":"What is the purpose of the IVS Startup Report that is printed in the morning?","answer":"It verifies that the accessible voting machine has been set up correctly. It must be signed by the SAR and Moderator."},{"question":"A voter wants to cast a \"write-in\" vote. Where do they write the name of the candidate?","answer":"The voter writes the name on the write-in line and fills in the oval. The name must appear under the specific office for which the candidate is running."},{"question":"During the hourly count, what numbers must be reconciled?","answer":"The public counter on the tabulator, the official checker’s tally sheet, and the ballot clerk’s tally sheet should all match."},{"question":"What happens if a voter's name has the designation CE next to it in the official checker book?","answer":"CE means \"Cure Eligible\"  The voter attempted to vote by absentee ballot, but they forgot to sign the envelope.  The voter may vote in person, but the polling place must call the ROVs or Town Clerk to let them know the absentee ballot should be voided."}]}}</script>
<script>
(function(){
'use strict';
var data = JSON.parse(document.getElementById('deck').textContent);
var deck = data.deck;
var order = deck.cards.map(function(_, i){ return i; });
var idx = 0, flipped = false;
var $ = function(id){ return document.getElementById(id); };
function el(tag, cls, text){ var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
$('title').textContent = deck.title;

function slides(){
  var s = [{ kind: 'cover' }];
  order.forEach(function(i, n){ s.push({ kind: 'card', card: deck.cards[i], n: n }); });
  if ((deck.closingMessage || '').trim()) s.push({ kind: 'ending' });
  return s;
}
function logo(){ if (deck.logo && deck.logo.dataUrl){ var i = el('img'); i.src = deck.logo.dataUrl; i.alt = ''; return i; } return null; }
function face(s, side){
  var fc = el('div', 'fc');
  fc.style.setProperty('--fc-bg', deck.colors.background);
  fc.style.setProperty('--fc-fg', deck.colors.text);
  if (s.kind === 'cover'){
    fc.classList.add('cover');
    fc.appendChild(logo() || el('div', 'noLogo', deck.title));
    fc.appendChild(el('div', 'start', 'Tap to begin'));
    return fc;
  }
  if (s.kind === 'ending'){
    fc.classList.add('ending');
    fc.appendChild(el('div', 'txt', deck.closingMessage));
    return fc;
  }
  var t = el('div', 'top-b'); t.appendChild(el('div', 'txt q', s.card.question));
  var m = el('div', 'mid');
  m.appendChild(side === 'back' ? el('div', 'txt a', s.card.answer) : el('div', 'hint', 'Tap to see the answer'));
  var b = el('div', 'bot'); b.appendChild(logo() || el('div', 'noLogo', ''));
  fc.appendChild(t); fc.appendChild(m); fc.appendChild(b);
  return fc;
}
function fit(node, max, min){
  var s = max; node.style.fontSize = s + 'px';
  while (s > min && node.scrollHeight > node.clientHeight + 1){ s--; node.style.fontSize = s + 'px'; }
}
function fitFace(fc){
  var q = fc.querySelector('.txt.q'), a = fc.querySelector('.txt.a');
  if (q) fit(q, 26, 18);
  if (a) fit(a, 24, 17);
  if (fc.classList.contains('ending')){
    var e = fc.querySelector('.txt'), s = 24; e.style.fontSize = s + 'px';
    while (s > 14 && e.scrollHeight > fc.clientHeight - 80){ s--; e.style.fontSize = s + 'px'; }
  }
}
var scale = 1;
function size(){
  var st = $('stage');
  var w = st.clientWidth - 32, h = st.clientHeight - 8;
  scale = Math.max(0.4, Math.min(w / 360, h / 504, 1.6));
  var vp = $('viewport');
  vp.style.width = (360 * scale) + 'px';
  vp.style.height = (504 * scale) + 'px';
  vp.querySelectorAll('.scaler').forEach(function(s){ s.style.transform = 'scale(' + scale + ')'; });
}
function render(dir){
  var all = slides();
  var s = all[idx];
  var slot = el('div', 'slot');
  var f = el('div', 'flipper' + (flipped ? ' flipped' : ''));
  f.tabIndex = 0; f.setAttribute('role', 'button');
  f.setAttribute('aria-label', s.kind === 'card' ? (flipped ? 'Answer: ' + s.card.answer : 'Question: ' + s.card.question + '. Activate to see the answer.') : s.kind === 'cover' ? deck.title + '. Use next to begin.' : deck.closingMessage);
  function wrap(fc, cls){ var w = el('div', 'face ' + cls); var sc = el('div', 'scaler'); sc.style.transform = 'scale(' + scale + ')'; sc.appendChild(fc); w.appendChild(sc); return w; }
  f.appendChild(wrap(face(s, 'front'), 'front'));
  if (s.kind === 'card') f.appendChild(wrap(face(s, 'back'), 'back'));
  f.addEventListener('click', function(){ if (s.kind === 'card') flip(); else if (s.kind === 'cover') go(1); });
  slot.appendChild(f);
  var vp = $('viewport'), old = vp.querySelector('.slot:last-child');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (old && dir && !reduce){
    old.classList.add(dir > 0 ? 'out-l' : 'out-r');
    slot.classList.add(dir > 0 ? 'in-r' : 'in-l');
    vp.appendChild(slot);
    slot.querySelectorAll('.fc').forEach(fitFace);
    slot.offsetWidth;
    slot.classList.remove('in-r', 'in-l');
    setTimeout(function(){ if (old.parentNode) old.parentNode.removeChild(old); }, 340);
  } else {
    vp.textContent = ''; vp.appendChild(slot);
    slot.querySelectorAll('.fc').forEach(fitFace);
  }
  var n = deck.cards.length;
  $('pos').textContent = s.kind === 'cover' ? n + ' cards' : s.kind === 'ending' ? 'Done' : (s.n + 1) + ' of ' + n;
  $('progress').style.width = (s.kind === 'cover' ? 0 : s.kind === 'ending' ? 100 : ((s.n + 1) / n) * 100) + '%';
  $('prev').disabled = idx === 0;
  $('next').disabled = idx === all.length - 1;
}
function flip(){
  flipped = !flipped;
  var f = $('viewport').querySelector('.slot:last-child .flipper');
  if (f) f.classList.toggle('flipped', flipped);
  var s = slides()[idx];
  if (f && s.kind === 'card') f.setAttribute('aria-label', flipped ? 'Answer: ' + s.card.answer : 'Question: ' + s.card.question + '. Activate to see the answer.');

function go(d){
  var n = slides().length, t = idx + d;
  if (t < 0 || t >= n) return;
  idx = t; flipped = false; render(d);

function restart(){ idx = 0; flipped = false; render(-1); }
$('prev').addEventListener('click', function(){ go(-1); });
$('next').addEventListener('click', function(){ go(1); });
$('restart').addEventListener('click', restart);
$('shuffle').addEventListener('click', function(){
  var on = this.getAttribute('aria-pressed') !== 'true';
  this.setAttribute('aria-pressed', on ? 'true' : 'false');
  order = deck.cards.map(function(_, i){ return i; });
  if (on) for (var i = order.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = order[i]; order[i] = order[j]; order[j] = t; }
  idx = 1; flipped = false; render(1);
});
document.addEventListener('keydown', function(e){
  if (e.target.closest && e.target.closest('.top')) return;
  if (e.key === 'ArrowRight'){ e.preventDefault(); go(1); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); go(-1); }
  else if ((e.key === ' ' || e.key === 'Enter') && !(e.target.tagName === 'BUTTON' && !e.target.classList.contains('flipper'))){ e.preventDefault(); if (slides()[idx].kind === 'card') flip(); else go(1); }
});
var x0 = null, y0 = 0;
$('stage').addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
$('stage').addEventListener('touchend', function(e){
  if (x0 === null) return;
  var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)){ e.preventDefault(); go(dx < 0 ? 1 : -1); }
});
window.addEventListener('resize', size);
size(); render(0);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ render(0); });
})();
</script>
